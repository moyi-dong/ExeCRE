[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execre"
version = "0.1.0"
description = "Execution-consistency guided reliability estimation for self-correcting code generation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yiru Dong" },
    { name = "Richong Zhang" },
    { name = "Fanshuang Kong" },
    { name = "Si Chen" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "anthropic>=0.42.0",
    "crowd-kit>=1.3.0",
    "datasets>=3.2.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
    "litellm>=1.50.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "openai>=1.59.0",
    "pandas>=2.0.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/moyi-dong/ExeCRE"
Repository = "https://github.com/moyi-dong/ExeCRE"
Artifact = "https://doi.org/10.5281/zenodo.19347857"

[project.optional-dependencies]
# Extra LiveCodeBench / runner tooling (torch for local vLLM paths, etc.).
lcb-full = [
    "pebble>=5.1.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = [".", "src/baselines/textgrad"]
include = ["src*", "textgrad*"]
