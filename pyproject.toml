[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execre-anonymous"
version = "0.1.0"
description = "Executable consistency / code generation experiments (ExeCRE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.42.0",
    "crowdkit>=1.3.0",
    "httpx>=0.27.0",
    "litellm>=1.50.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "openai>=1.59.0",
    "pandas>=2.0.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Full LiveCodeBench `lcb_runner` CLI and HuggingFace `datasets` loaders.
lcb-full = [
    "datasets>=3.2.0",
    "pebble>=5.1.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = [".", "src/baselines/textgrad"]
include = ["src*", "textgrad*"]
